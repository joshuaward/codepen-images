<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AWS Certified AI Practitioner – AIF-C01 Practice Test</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap');

  :root {
    --aws-orange: #FF9900;
    --aws-dark: #0D1117;
    --aws-navy: #131F2E;
    --aws-blue: #1A6DAF;
    --aws-light-blue: #4DB8FF;
    --text-primary: #E6EDF3;
    --text-secondary: #8B949E;
    --border: #30363D;
    --correct: #3FB950;
    --incorrect: #F85149;
    --card-bg: #161B22;
    --hover-bg: #1C2128;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'IBM Plex Sans', sans-serif;
    background: var(--aws-dark);
    color: var(--text-primary);
    min-height: 100vh;
  }

  /* HEADER */
  .header {
    background: linear-gradient(135deg, var(--aws-navy) 0%, #0A1628 100%);
    border-bottom: 1px solid var(--border);
    padding: 24px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-left { display: flex; align-items: center; gap: 16px; }
  .aws-badge {
    background: var(--aws-orange);
    color: #000;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 3px;
    letter-spacing: 0.5px;
  }
  .header h1 {
    font-size: 18px;
    font-weight: 600;
    color: var(--text-primary);
  }
  .header h1 span { color: var(--aws-orange); }
  .header-right { display: flex; align-items: center; gap: 20px; }
  .progress-bar-wrap {
    width: 200px;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--aws-orange);
    border-radius: 3px;
    transition: width 0.4s ease;
  }
  .progress-text {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--text-secondary);
    min-width: 60px;
    text-align: right;
  }

  /* MAIN */
  .main {
    max-width: 860px;
    margin: 0 auto;
    padding: 40px 24px 100px;
  }

  /* DOMAIN TAG */
  .domain-tag {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 16px;
  }
  .domain-1 { background: rgba(79,140,255,0.15); color: #4F8CFF; border: 1px solid rgba(79,140,255,0.3); }
  .domain-2 { background: rgba(163,113,247,0.15); color: #A371F7; border: 1px solid rgba(163,113,247,0.3); }
  .domain-3 { background: rgba(255,153,0,0.15); color: var(--aws-orange); border: 1px solid rgba(255,153,0,0.3); }
  .domain-4 { background: rgba(63,185,80,0.15); color: var(--correct); border: 1px solid rgba(63,185,80,0.3); }
  .domain-5 { background: rgba(248,81,73,0.15); color: var(--incorrect); border: 1px solid rgba(248,81,73,0.3); }

  /* QUESTION CARD */
  .question-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
    margin-bottom: 24px;
    transition: border-color 0.2s;
  }
  .question-card.answered { border-color: #30363D; }
  .question-card.correct-card { border-color: var(--correct); }
  .question-card.incorrect-card { border-color: var(--incorrect); }

  .question-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .question-number {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--text-secondary);
  }
  .question-type {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 4px;
    background: rgba(139,148,158,0.1);
    color: var(--text-secondary);
    border: 1px solid var(--border);
    font-family: 'IBM Plex Mono', monospace;
  }
  .question-type.multi { background: rgba(255,153,0,0.1); color: var(--aws-orange); border-color: rgba(255,153,0,0.3); }

  .question-text {
    font-size: 16px;
    line-height: 1.65;
    font-weight: 400;
    color: var(--text-primary);
    margin-bottom: 24px;
  }
  .scenario-box {
    background: var(--aws-navy);
    border-left: 3px solid var(--aws-orange);
    padding: 14px 18px;
    border-radius: 0 8px 8px 0;
    margin-bottom: 16px;
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.6;
  }

  /* OPTIONS */
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 14px 18px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--aws-dark);
    cursor: pointer;
    transition: all 0.15s;
    text-align: left;
    width: 100%;
    color: var(--text-primary);
    font-size: 14.5px;
    line-height: 1.55;
  }
  .option:hover:not(:disabled) { background: var(--hover-bg); border-color: #4A5568; }
  .option:disabled { cursor: default; }
  .option.selected { border-color: var(--aws-orange); background: rgba(255,153,0,0.07); }
  .option.correct { border-color: var(--correct); background: rgba(63,185,80,0.1); }
  .option.wrong { border-color: var(--incorrect); background: rgba(248,81,73,0.1); }

  .option-letter {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    width: 24px;
    height: 24px;
    min-width: 24px;
    border-radius: 4px;
    background: var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-secondary);
    margin-top: 1px;
  }
  .option.selected .option-letter { background: var(--aws-orange); color: #000; }
  .option.correct .option-letter { background: var(--correct); color: #000; }
  .option.wrong .option-letter { background: var(--incorrect); color: #fff; }

  /* SUBMIT BUTTON */
  .submit-btn {
    margin-top: 20px;
    padding: 12px 28px;
    background: var(--aws-orange);
    color: #000;
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 600;
    font-size: 14px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .submit-btn:hover { opacity: 0.85; }
  .submit-btn:disabled { opacity: 0.3; cursor: default; }

  /* EXPLANATION */
  .explanation {
    margin-top: 20px;
    padding: 18px 20px;
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.65;
    display: none;
  }
  .explanation.show { display: block; }
  .explanation.correct-exp { background: rgba(63,185,80,0.08); border: 1px solid rgba(63,185,80,0.25); }
  .explanation.incorrect-exp { background: rgba(248,81,73,0.08); border: 1px solid rgba(248,81,73,0.25); }
  .explanation-header {
    font-weight: 600;
    font-size: 13px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .explanation.correct-exp .explanation-header { color: var(--correct); }
  .explanation.incorrect-exp .explanation-header { color: var(--incorrect); }

  /* RESULTS */
  .results-panel {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 48px;
    text-align: center;
    display: none;
  }
  .results-panel.show { display: block; }
  .results-score {
    font-size: 72px;
    font-weight: 700;
    font-family: 'IBM Plex Mono', monospace;
    color: var(--aws-orange);
    line-height: 1;
    margin: 16px 0;
  }
  .results-label { font-size: 14px; color: var(--text-secondary); margin-bottom: 8px; }
  .pass-fail {
    display: inline-block;
    font-size: 18px;
    font-weight: 700;
    padding: 8px 28px;
    border-radius: 6px;
    margin: 16px 0 32px;
    font-family: 'IBM Plex Mono', monospace;
    letter-spacing: 1px;
  }
  .pass { background: rgba(63,185,80,0.2); color: var(--correct); border: 1px solid var(--correct); }
  .fail { background: rgba(248,81,73,0.2); color: var(--incorrect); border: 1px solid var(--incorrect); }

  .domain-breakdown {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
    margin: 24px 0;
    text-align: left;
  }
  .domain-score-card {
    background: var(--aws-dark);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
  }
  .domain-score-name { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
  .domain-score-val {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 20px;
    font-weight: 600;
    color: var(--text-primary);
  }
  .domain-score-bar {
    margin-top: 8px;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .domain-score-fill { height: 100%; border-radius: 2px; }

  .restart-btn {
    margin-top: 16px;
    padding: 14px 36px;
    background: var(--aws-orange);
    color: #000;
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 700;
    font-size: 15px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .restart-btn:hover { opacity: 0.85; }

  /* FINISH BAR */
  .finish-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--card-bg);
    border-top: 1px solid var(--border);
    padding: 16px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 50;
  }
  .finish-bar-info { font-size: 14px; color: var(--text-secondary); }
  .finish-bar-info span { color: var(--text-primary); font-weight: 600; }
  .finish-btn {
    padding: 12px 32px;
    background: var(--aws-orange);
    color: #000;
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 700;
    font-size: 15px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .finish-btn:hover { opacity: 0.85; }
  .finish-btn:disabled { opacity: 0.3; cursor: default; }

  .multi-hint {
    font-size: 12px;
    color: var(--aws-orange);
    margin-bottom: 14px;
    font-family: 'IBM Plex Mono', monospace;
  }

  @media (max-width: 600px) {
    .header { padding: 16px 20px; flex-direction: column; gap: 12px; align-items: flex-start; }
    .main { padding: 24px 16px 100px; }
    .question-card { padding: 20px; }
    .results-panel { padding: 28px 20px; }
    .results-score { font-size: 52px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="aws-badge">AIF-C01</div>
    <h1>AWS Certified <span>AI Practitioner</span> — Practice Test</h1>
  </div>
  <div class="header-right">
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
    </div>
    <div class="progress-text" id="progressText">0 / 30</div>
  </div>
</div>

<div class="main" id="mainContent">
  <!-- Questions injected here -->
</div>

<div class="finish-bar" id="finishBar">
  <div class="finish-bar-info">Answered: <span id="answeredCount">0</span> / 30</div>
  <button class="finish-btn" id="finishBtn" disabled onclick="showResults()">Submit Test</button>
</div>

<script>
const QUESTIONS = [
  // ─────────────────────────────────────────────────
  // DOMAIN 1: Fundamentals of AI and ML (6 questions)
  // ─────────────────────────────────────────────────
  {
    id: 1, domain: 1,
    type: "single",
    text: "A data scientist wants to train a model to predict whether an email is spam or not. The training dataset contains emails that have already been labeled as spam or not spam. Which type of machine learning is being used?",
    options: [
      "Unsupervised learning",
      "Reinforcement learning",
      "Supervised learning",
      "Self-supervised learning"
    ],
    correct: [2],
    explanation: "Supervised learning uses labeled training data, where each input has a known output (label). Because the emails are pre-labeled as spam/not spam, this is a supervised classification task. Unsupervised learning finds patterns in unlabeled data; reinforcement learning uses rewards/penalties; self-supervised learning generates its own labels from raw data."
  },
  {
    id: 2, domain: 1,
    type: "single",
    text: "A company trains an ML model to predict house prices. The model performs extremely well on training data but performs poorly on new, unseen data. Which concept BEST describes this problem?",
    options: [
      "Underfitting",
      "Overfitting",
      "Class imbalance",
      "Data drift"
    ],
    correct: [1],
    explanation: "Overfitting occurs when a model learns the training data too well — including noise — and fails to generalize to unseen data. This is reflected by high training accuracy and low test accuracy. Underfitting is the opposite (model too simple). Class imbalance affects classification. Data drift is a production concern."
  },
  {
    id: 3, domain: 1,
    type: "multi",
    text: "A company is evaluating whether to use an ML solution. In which TWO situations would an ML solution likely NOT be the best approach? (Select TWO)",
    options: [
      "When a deterministic, rule-based algorithm can solve the problem reliably",
      "When the company wants to identify fraud patterns in millions of transactions",
      "When regulatory requirements mandate a fully explainable, auditable decision process with no tolerance for probabilistic outputs",
      "When the company needs real-time product recommendations for an e-commerce site",
      "When there is a large volume of labeled image data for a computer vision task"
    ],
    correct: [0, 2],
    explanation: "ML adds unnecessary complexity when deterministic rules work perfectly (A). Compliance-heavy environments requiring full auditability and zero probabilistic error are also poor fits for ML (C). Fraud detection (B), recommendation engines (D), and image classification with labeled data (E) are all strong ML use cases."
  },
  {
    id: 4, domain: 1,
    type: "single",
    text: "A machine learning pipeline includes stages for data collection, data pre-processing, model training, evaluation, and deployment. A team wants to automate model retraining when model performance degrades in production. Which AWS service is MOST suited for monitoring a deployed model and detecting data or concept drift?",
    options: [
      "Amazon SageMaker Feature Store",
      "Amazon SageMaker Model Monitor",
      "AWS Glue DataBrew",
      "Amazon SageMaker Data Wrangler"
    ],
    correct: [1],
    explanation: "Amazon SageMaker Model Monitor continuously monitors the quality of deployed ML models by detecting data drift, model quality drift, bias drift, and feature attribution drift. SageMaker Feature Store manages feature data. Glue DataBrew and Data Wrangler are used for data preparation stages, not production monitoring."
  },
  {
    id: 5, domain: 1,
    type: "single",
    text: "A business analyst wants to analyze customer sentiment from thousands of product reviews. They have no data science experience. Which AWS managed AI service provides a ready-to-use capability for this task WITHOUT requiring model training?",
    options: [
      "Amazon SageMaker",
      "Amazon Rekognition",
      "Amazon Comprehend",
      "Amazon Lex"
    ],
    correct: [2],
    explanation: "Amazon Comprehend is a natural language processing (NLP) service that provides pre-trained models for sentiment analysis, entity recognition, key phrase extraction, and more — no training required. SageMaker requires ML expertise. Rekognition is for image/video analysis. Lex is for building conversational interfaces (chatbots)."
  },
  {
    id: 6, domain: 1,
    type: "single",
    text: "A model evaluation report shows an F1 score of 0.92 and an AUC-ROC of 0.88. An F1 score combines which two metrics?",
    options: [
      "Accuracy and recall",
      "Precision and recall",
      "Sensitivity and specificity",
      "True positive rate and false positive rate"
    ],
    correct: [1],
    explanation: "The F1 score is the harmonic mean of precision and recall. It is particularly useful when class distributions are imbalanced. AUC-ROC measures the tradeoff between true positive rate and false positive rate across thresholds. Accuracy alone can be misleading with imbalanced datasets."
  },

  // ─────────────────────────────────────────────────
  // DOMAIN 2: Fundamentals of Generative AI (7 questions)
  // ─────────────────────────────────────────────────
  {
    id: 7, domain: 2,
    type: "single",
    text: "A generative AI application produces a confident but factually incorrect answer about a recent event. The model was not trained on this event. Which generative AI limitation BEST describes this behavior?",
    options: [
      "Bias",
      "Overfitting",
      "Hallucination",
      "Prompt injection"
    ],
    correct: [2],
    explanation: "Hallucination refers to when an LLM generates plausible-sounding but factually incorrect or fabricated information. This commonly occurs when the model is asked about topics outside its training data or knowledge cutoff. Bias refers to skewed outputs from skewed training data. Prompt injection is a security attack."
  },
  {
    id: 8, domain: 2,
    type: "single",
    text: "A large language model converts text into numerical representations that capture semantic meaning, enabling similarity searches across documents. What are these numerical representations called?",
    options: [
      "Tokens",
      "Parameters",
      "Embeddings",
      "Weights"
    ],
    correct: [2],
    explanation: "Embeddings are dense numerical vector representations of text (or other data) that capture semantic meaning. They allow AI systems to compare similarity between pieces of text. Tokens are the smallest units of text processed by an LLM. Parameters and weights are part of the model's internal learned values."
  },
  {
    id: 9, domain: 2,
    type: "single",
    text: "An enterprise is selecting a foundation model for a multilingual customer support chatbot that must respond in under 2 seconds and handle 15 languages. Which factor is the MOST critical initial selection criterion?",
    options: [
      "Model size measured in total parameter count",
      "Modality support and multi-lingual capability",
      "The AWS Region where the model is hosted",
      "Whether the model supports custom fine-tuning"
    ],
    correct: [1],
    explanation: "For a multilingual chatbot, the model's ability to understand and respond in multiple languages (modality and multi-lingual capability) is the most critical initial criterion. Latency (response time) is closely tied to model size and infrastructure, but without language support, those considerations are moot. Fine-tuning can be done later if needed."
  },
  {
    id: 10, domain: 2,
    type: "multi",
    text: "A startup wants to build and prototype a generative AI application on AWS. Which TWO AWS services are MOST directly suited for developing and experimenting with generative AI applications using foundation models? (Select TWO)",
    options: [
      "Amazon Bedrock",
      "AWS Glue",
      "Amazon SageMaker JumpStart",
      "Amazon Redshift",
      "AWS Lake Formation"
    ],
    correct: [0, 2],
    explanation: "Amazon Bedrock provides fully managed access to a wide range of foundation models via API, making it ideal for building GenAI apps without managing infrastructure. Amazon SageMaker JumpStart offers pre-trained models, solution templates, and one-click deployment for ML and GenAI. AWS Glue, Redshift, and Lake Formation are data services, not GenAI development platforms."
  },
  {
    id: 11, domain: 2,
    type: "single",
    text: "A company is evaluating the cost of using a foundation model in production. The model provider charges based on the number of tokens processed in requests and responses. The team notices that adding extensive context to every API call significantly increases costs. What pricing model is being described?",
    options: [
      "Provisioned throughput pricing",
      "Instance-based compute pricing",
      "Token-based pricing",
      "Reserved capacity pricing"
    ],
    correct: [2],
    explanation: "Token-based pricing charges based on the number of input and output tokens consumed per API call. Longer prompts and responses directly increase cost. Provisioned throughput is a separate model that reserves model capacity for consistent performance and is priced differently. Instance-based pricing applies to compute infrastructure."
  },
  {
    id: 12, domain: 2,
    type: "single",
    text: "A development team wants to give business users a no-code environment to prototype and experiment with generative AI applications using Amazon Bedrock foundation models. Which AWS offering BEST meets this need?",
    options: [
      "Amazon Q Developer",
      "PartyRock, an Amazon Bedrock Playground",
      "Amazon SageMaker Studio",
      "Amazon Lex"
    ],
    correct: [1],
    explanation: "PartyRock is a no-code, hands-on generative AI app-building playground powered by Amazon Bedrock. It lets users experiment with foundation models and build shareable AI-powered apps without writing code. Amazon Q Developer is an AI coding assistant. SageMaker Studio is an IDE for ML development. Lex is a conversational AI service."
  },
  {
    id: 13, domain: 2,
    type: "single",
    text: "A foundation model is described as 'multi-modal.' What does this mean?",
    options: [
      "The model can be deployed in multiple AWS Regions simultaneously",
      "The model can process and/or generate multiple types of data such as text, images, and audio",
      "The model uses multiple neural network architectures in an ensemble",
      "The model supports multiple programming language SDKs"
    ],
    correct: [1],
    explanation: "A multi-modal model can work with more than one type of data modality — for example, processing both text and images as input and/or generating outputs in different formats (text, image, audio). This enables use cases like image captioning, visual question answering, and text-to-image generation."
  },

  // ─────────────────────────────────────────────────
  // DOMAIN 3: Applications of Foundation Models (9 questions)
  // ─────────────────────────────────────────────────
  {
    id: 14, domain: 3,
    type: "single",
    text: "A company wants its foundation model to answer questions based on its internal knowledge base of proprietary documents. The documents are not part of the model's training data. Which approach allows the model to answer accurately WITHOUT retraining the model?",
    options: [
      "Continuous pre-training",
      "Retrieval Augmented Generation (RAG)",
      "Instruction fine-tuning",
      "Increasing the temperature parameter"
    ],
    correct: [1],
    explanation: "RAG augments a foundation model by retrieving relevant documents from an external knowledge base at inference time and including them in the prompt context. This allows the model to answer questions using up-to-date or proprietary information without the cost of retraining. Fine-tuning modifies model weights. Increasing temperature affects randomness, not knowledge."
  },
  {
    id: 15, domain: 3,
    type: "single",
    text: "A company is building a RAG application on Amazon Bedrock. They need to store and retrieve vector embeddings from their document knowledge base. Which AWS service is designed to store and query these vector embeddings?",
    options: [
      "Amazon S3 Glacier",
      "AWS Glue",
      "Amazon OpenSearch Service",
      "Amazon DynamoDB"
    ],
    correct: [2],
    explanation: "Amazon OpenSearch Service supports vector search capabilities and is a supported vector store for Amazon Bedrock Knowledge Bases. Other AWS services that support vector embeddings for RAG include Amazon Aurora (pgvector), Amazon RDS for PostgreSQL, Amazon Neptune, and Amazon DocumentDB. S3 Glacier is for archival. DynamoDB does not natively support vector search."
  },
  {
    id: 16, domain: 3,
    type: "single",
    text: "A developer is crafting a prompt for a foundation model. The prompt provides the task description followed by three example input-output pairs before asking the model to complete a new task. Which prompt engineering technique is this?",
    options: [
      "Zero-shot prompting",
      "Chain-of-thought prompting",
      "Few-shot prompting",
      "Negative prompting"
    ],
    correct: [2],
    explanation: "Few-shot prompting provides several (typically 2–5) examples of input-output pairs within the prompt to guide the model's behavior on a new task. Zero-shot provides no examples. Chain-of-thought asks the model to reason through steps. Negative prompting specifies what the model should NOT do or include."
  },
  {
    id: 17, domain: 3,
    type: "single",
    text: "A team wants a foundation model to complete a multi-step workflow: look up a customer account, check order history, and then draft a personalized email. This requires the model to call external APIs and tools autonomously across multiple steps. Which Amazon Bedrock feature enables this?",
    options: [
      "Amazon Bedrock Guardrails",
      "Amazon Bedrock Knowledge Bases",
      "Agents for Amazon Bedrock",
      "Amazon Bedrock Model Evaluation"
    ],
    correct: [2],

const DOMAIN_LABELS = {
  1: "Domain 1: Fundamentals of AI & ML",
  2: "Domain 2: Fundamentals of GenAI",
  3: "Domain 3: Applications of Foundation Models",
  4: "Domain 4: Responsible AI",
  5: "Domain 5: Security & Governance"
};
const DOMAIN_SHORT = {1:"AI & ML Fundamentals", 2:"GenAI Fundamentals", 3:"Foundation Models", 4:"Responsible AI", 5:"Security & Governance"};

const state = {
  answers: {},     // questionId -> [selectedIndices]
  submitted: {},   // questionId -> bool
};

function renderQuestions() {
  const container = document.getElementById('mainContent');
  container.innerHTML = '';
  QUESTIONS.forEach(q => {
    container.innerHTML += buildQuestionHTML(q);
  });
  updateProgress();
}

function buildQuestionHTML(q) {
  const domainClass = `domain-${q.domain}`;
  const typeLabel = q.type === 'multi' ? 'Multiple Response' : 'Multiple Choice';
  const typeClass = q.type === 'multi' ? 'multi' : '';
  const optionsHTML = q.options.map((opt, i) => {
    const letter = String.fromCharCode(65 + i);
    return `
      <button class="option" id="q${q.id}_opt${i}" onclick="selectOption(${q.id}, ${i})" ${q.type === 'multi' ? '' : ''}>
        <span class="option-letter">${letter}</span>
        <span>${opt}</span>
      </button>`;
  }).join('');

  return `
  <div class="question-card" id="card_${q.id}">
    <div class="question-meta">
      <span class="question-number">Question ${q.id} of ${QUESTIONS.length}</span>
      <span class="question-type ${typeClass}">${typeLabel}</span>
    </div>
    <div class="domain-tag ${domainClass}">${DOMAIN_LABELS[q.domain]}</div>
    ${q.type === 'multi' ? `<div class="multi-hint">▸ Select all correct answers</div>` : ''}
    <p class="question-text">${q.text}</p>
    <div class="options" id="options_${q.id}">
      ${optionsHTML}
    </div>
    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <button class="submit-btn" id="submit_${q.id}" onclick="submitAnswer(${q.id})" disabled>Check Answer</button>
    </div>
    <div class="explanation" id="exp_${q.id}"></div>
  </div>`;
}

function selectOption(qId, idx) {
  if (state.submitted[qId]) return;
  const q = QUESTIONS.find(x => x.id === qId);
  if (!state.answers[qId]) state.answers[qId] = [];

  if (q.type === 'multi') {
    const pos = state.answers[qId].indexOf(idx);
    if (pos > -1) state.answers[qId].splice(pos, 1);
    else state.answers[qId].push(idx);
  } else {
    state.answers[qId] = [idx];
  }

  // Re-render option visual states
  q.options.forEach((_, i) => {
    const btn = document.getElementById(`q${qId}_opt${i}`);
    btn.classList.remove('selected');
  });
  state.answers[qId].forEach(i => {
    document.getElementById(`q${qId}_opt${i}`).classList.add('selected');
  });

  // Enable submit if something selected
  const submitBtn = document.getElementById(`submit_${qId}`);
  submitBtn.disabled = state.answers[qId].length === 0;
}

function submitAnswer(qId) {
  if (state.submitted[qId]) return;
  state.submitted[qId] = true;
  const q = QUESTIONS.find(x => x.id === qId);
  const selected = state.answers[qId] || [];
  const correct = q.correct;

  const isCorrect = selected.length === correct.length &&
    selected.every(i => correct.includes(i));

  // Style options
  q.options.forEach((_, i) => {
    const btn = document.getElementById(`q${qId}_opt${i}`);
    btn.disabled = true;
    btn.classList.remove('selected');
    if (correct.includes(i)) btn.classList.add('correct');
    else if (selected.includes(i)) btn.classList.add('wrong');
  });

  // Card border
  const card = document.getElementById(`card_${qId}`);
  card.classList.add(isCorrect ? 'correct-card' : 'incorrect-card');

  // Explanation
  const expDiv = document.getElementById(`exp_${qId}`);
  expDiv.className = `explanation show ${isCorrect ? 'correct-exp' : 'incorrect-exp'}`;
  const correctLetters = correct.map(i => String.fromCharCode(65 + i)).join(', ');
  expDiv.innerHTML = `
    <div class="explanation-header">
      ${isCorrect ? '✓ Correct' : `✗ Incorrect — Correct answer: ${correctLetters}`}
    </div>
    <div>${q.explanation}</div>`;

  // Hide submit button
  document.getElementById(`submit_${qId}`).style.display = 'none';

  updateProgress();
  updateFinishBar();
}

function updateProgress() {
  const answered = Object.keys(state.submitted).length;
  const pct = (answered / QUESTIONS.length) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${answered} / ${QUESTIONS.length}`;
}

function updateFinishBar() {
  const answered = Object.keys(state.submitted).length;
  document.getElementById('answeredCount').textContent = answered;
  document.getElementById('finishBtn').disabled = answered < QUESTIONS.length;
}

function showResults() {
  // Calculate score
  let total = 0, correct = 0;
  const domainScores = {1:{c:0,t:0},2:{c:0,t:0},3:{c:0,t:0},4:{c:0,t:0},5:{c:0,t:0}};

  QUESTIONS.forEach(q => {
    total++;
    domainScores[q.domain].t++;
    const selected = state.answers[q.id] || [];
    const isCorrect = selected.length === q.correct.length && selected.every(i => q.correct.includes(i));
    if (isCorrect) { correct++; domainScores[q.domain].c++; }
  });

  const pct = Math.round((correct / total) * 100);
  const scaledScore = Math.round(100 + (pct / 100) * 900);
  const passed = scaledScore >= 700;

  // Scroll to top
  window.scrollTo({top: 0, behavior: 'smooth'});

  // Inject results
  const container = document.getElementById('mainContent');
  const domainCards = Object.entries(domainScores).map(([d, s]) => {
    const dpct = s.t > 0 ? Math.round((s.c / s.t) * 100) : 0;
    const colors = {1:'#4F8CFF',2:'#A371F7',3:'#FF9900',4:'#3FB950',5:'#F85149'};
    return `
      <div class="domain-score-card">
        <div class="domain-score-name">${DOMAIN_SHORT[d]}</div>
        <div class="domain-score-val">${s.c}/${s.t}</div>
        <div class="domain-score-bar">
          <div class="domain-score-fill" style="width:${dpct}%;background:${colors[d]}"></div>
        </div>
      </div>`;
  }).join('');

  container.innerHTML = `
  <div class="results-panel show">
    <div class="results-label">Your Score</div>
    <div class="results-score">${correct}/${total}</div>
    <div class="results-label">Scaled Score: <strong style="color:var(--text-primary)">${scaledScore}</strong> / 1000 &nbsp;|&nbsp; Passing: 700</div>
    <div class="pass-fail ${passed ? 'pass' : 'fail'}">${passed ? 'PASS' : 'FAIL'}</div>
    <div class="domain-breakdown">${domainCards}</div>
    <p style="color:var(--text-secondary);font-size:13px;margin-top:8px">
      ${passed
        ? "Great work! You're on track for the AIF-C01 exam. Review any missed questions before test day."
        : "Keep studying! Focus on your lower-scoring domains and review the official AWS exam guide."}
    </p>
    <button class="restart-btn" onclick="restartTest()">↺ Retake Practice Test</button>
  </div>`;

  document.getElementById('finishBar').style.display = 'none';
}

function restartTest() {
  state.answers = {};
  state.submitted = {};
  document.getElementById('finishBar').style.display = 'flex';
  renderQuestions();
  updateFinishBar();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

renderQuestions();
</script>
